[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bh-fastapi-audit"
version = "0.1.0"
description = "FastAPI middleware for emitting PHI-safe audit events for behavioral healthcare systems"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "BH Healthcare", email = "oss@bh-healthcare.github.io" }
]
keywords = [
    "fastapi",
    "audit",
    "healthcare",
    "hipaa",
    "phi",
    "logging",
    "middleware",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "sqlalchemy>=2.0.0",
]
jsonschema = [
    "jsonschema>=4.0.0",
]
sqlalchemy = [
    "sqlalchemy>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/bh-healthcare/bh-fastapi-audit"
Documentation = "https://github.com/bh-healthcare/bh-fastapi-audit#readme"
Repository = "https://github.com/bh-healthcare/bh-fastapi-audit"
Issues = "https://github.com/bh-healthcare/bh-fastapi-audit/issues"
Changelog = "https://github.com/bh-healthcare/bh-fastapi-audit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/bh_fastapi_audit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel.shared-data]

# Include JSON schema files in the package
[tool.hatch.build]
include = [
    "src/bh_fastapi_audit/**/*.py",
    "src/bh_fastapi_audit/**/*.json",
    "src/bh_fastapi_audit/py.typed",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

