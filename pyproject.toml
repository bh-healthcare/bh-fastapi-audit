[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bh-fastapi-audit"
version = "1.1.1"
description = "FastAPI ASGI middleware for emitting PHI-safe audit events for behavioral healthcare systems"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "BH Healthcare", email = "oss@bh-healthcare.org" }
]
keywords = [
    "fastapi",
    "audit",
    "healthcare",
    "hipaa",
    "phi",
    "logging",
    "middleware",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.100.0,<1",         # ASGI framework for middleware integration
    "pydantic>=2.0.0,<3",          # Config validation (required by FastAPI)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "moto[dynamodb]>=5.0,<6",      # AWS service mocking for DynamoDB tests
    "boto3>=1.34,<2",              # Needed at test time for DynamoDB sink tests
    "jsonschema>=4.20,<5",         # Needed at test time for validation tests
    "typer>=0.9,<1",               # CLI tests
]
jsonschema = [
    "jsonschema>=4.20,<5",         # Runtime schema validation (opt-in via validate_events=True)
]
sqlalchemy = [
    "sqlalchemy>=2.0.0",
]
dynamodb = [
    "boto3>=1.34,<2",              # AWS SDK for DynamoDB audit sink
]
cli = [
    "typer>=0.9,<1",               # Verifier CLI (bh-audit verify)
]

[project.scripts]
bh-audit = "bh_fastapi_audit.cli:app"

[project.urls]
Homepage = "https://github.com/bh-healthcare/bh-fastapi-audit"
Documentation = "https://github.com/bh-healthcare/bh-fastapi-audit#readme"
Repository = "https://github.com/bh-healthcare/bh-fastapi-audit"
Issues = "https://github.com/bh-healthcare/bh-fastapi-audit/issues"
Changelog = "https://github.com/bh-healthcare/bh-fastapi-audit/blob/main/CHANGELOG.md"
Author = "https://tanmayakumar.com"

[tool.hatch.build.targets.wheel]
packages = ["src/bh_fastapi_audit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

# Include JSON schema files and py.typed marker in the package
[tool.hatch.build]
artifacts = [
    "*.json",
    "py.typed",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

